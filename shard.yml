name: freetype-cr
version: 1.0.0
description: |
  TrueType hinting and rasterization in pure Crystal: the ftgrays
  anti-aliasing rasterizer, the ttinterp bytecode-hinting VM and an
  SFNT loader, ported from FreeType 2.14.3 — pixel-exact hinted glyphs
  with no libfreetype dependency. The system FreeType is used as a test
  oracle only.
license: MIT
repository: https://github.com/OrelSokolov/freetype.cr
authors:
  - Oleg Orlov <orelcokolov@gmail.com>

dependencies:
  brotli:
    git: https://github.com/OrelSokolov/brotli.cr.git
