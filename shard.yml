name: freetype-cr
version: 0.2.0
description: |
  Crystal port of FreeType's TrueType pipeline: the ftgrays
  anti-aliasing rasterizer (B1) and the ttinterp bytecode hinter with an
  SFNT loader (B2) — pixel-exact hinted glyphs without libfreetype. The
  system FreeType stays as a test oracle only. Consumed by egui.cr as
  backend CrystalFonts.
