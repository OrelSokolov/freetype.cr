# CI: build the shard and run the test suite.
#
# The acceptance specs diff our pipeline against the system libfreetype
# via FFI (test oracle only) and expect bit-exact agreement with
# FreeType 2.13.3 — spec/tt_hinted_diff.cr records the known
# 2.13.3-vs-master divergences as expected. ubuntu-24.04 ships 2.13.2,
# so the oracle is built from the 2.13.3 tarball into /usr/local to
# keep the comparison deterministic.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # Refresh the apt index first: install-crystal apt-installs its
      # own dev deps, and the runner image's cached index can be stale
      # enough that the mirrored debs 404.
      - name: Update apt index
        run: sudo apt-get update

      - uses: crystal-lang/install-crystal@v1
        with:
          crystal: latest

      - name: Install fonts
        run: |
          sudo apt-get install -y --no-install-recommends \
            fonts-dejavu-core fonts-dejavu-extra fonts-liberation \
            fonts-roboto-unhinted fonts-noto-core \
            fonts-urw-base35 fonts-texgyre fonts-lmodern fonts-ubuntu

      # CID-keyed CFF font for the FDArray/FDSelect acceptance run
      # (~16 MB; the URL is the noto-cjk repo's raw OTF).
      - name: Download Noto Sans CJK JP (CID font)
        run: |
          mkdir -p .cidfont
          curl -sSfL -o .cidfont/NotoSansCJKjp-Regular.otf \
            https://github.com/notofonts/noto-cjk/raw/main/Sans/OTF/Japanese/NotoSansCJKjp-Regular.otf
          ls -la .cidfont/

      # NB: CFLAGS adds FT_CONFIG_OPTION_SUBPIXEL_RENDERING: without it
      # the tarball's LCD/LCD_V render skips the FIR filter and
      # spec/mono_lcd_diff.cr (which matches the filter bit-for-bit)
      # would fail. MONO output is identical either way (verified).
      - name: Build FreeType 2.13.3 oracle
        run: |
          set -euxo pipefail
          curl -sSfL -o freetype.tar.xz \
            https://download.savannah.gnu.org/releases/freetype/freetype-2.13.3.tar.xz
          tar xf freetype.tar.xz
          (
            cd freetype-2.13.3
            ./configure --prefix=/usr/local \
              --with-harfbuzz=no --with-brotli=no --with-png=no --with-bzip2=no \
              CFLAGS="-O2 -DFT_CONFIG_OPTION_SUBPIXEL_RENDERING"
            make -j"$(nproc)"
            sudo make install
          )
          sudo ldconfig
          rm -rf freetype.tar.xz freetype-2.13.3
          echo "LIBRARY_PATH=/usr/local/lib" >> "$GITHUB_ENV"

      # WOFF2 is compiled in by default now, so every build pulls in the
      # brotli shard (see shard.yml).
      - name: Install shards
        run: shards install

      - name: Build
        run: crystal build --error-trace src/freetype-cr.cr

      - name: Spec (VM degradation)
        run: crystal spec --error-trace

      - name: Smoke (synthetic shapes)
        run: crystal run --release --error-trace spec/ftgrays_smoke.cr

      - name: Rasterizer diff vs libfreetype (unhinted corpus)
        run: crystal run --release --error-trace spec/ftgrays_diff.cr

      - name: Unhinted pipeline diff vs libfreetype
        run: crystal run --release --error-trace spec/tt_unhinted_diff.cr

      - name: Hinted pipeline diff vs libfreetype
        run: crystal run --release --error-trace spec/tt_hinted_diff.cr

      - name: Auto-hinter diff vs libfreetype (unhinted Roboto corpus)
        run: crystal run --release --error-trace spec/autohint_diff.cr

      - name: GX variations diff vs libfreetype (variable Ubuntu corpus)
        run: crystal run --release --error-trace spec/var_diff.cr

      - name: cvar diff vs libfreetype (synthesized variable Liberation)
        run: crystal run --release --error-trace spec/var_cvar_diff.cr

      - name: MVAR metric diff vs libfreetype (synthesized variable Liberation)
        run: crystal run --release --error-trace spec/var_mvar_diff.cr

      - name: CFF2 variations diff vs libfreetype (SourceSerif4Variable)
        run: crystal run --release --error-trace spec/cff2_var_diff.cr

      - name: MONO/LCD/LCD_V render diff vs libfreetype
        run: crystal run --release --error-trace spec/mono_lcd_diff.cr

      - name: CFF pipeline diff vs libfreetype (unhinted corpus)
        run: crystal run --release --error-trace spec/cff_unhinted_diff.cr

      - name: CFF CID diff vs libfreetype (Noto Sans CJK JP)
        run: crystal run --release --error-trace spec/cff_unhinted_diff.cr -- .cidfont/NotoSansCJKjp-Regular.otf

      - name: CFF hinted diff vs libfreetype (Adobe engine)
        run: crystal run --release --error-trace spec/cff_hinted_diff.cr

      - name: WOFF unwrap diff vs libfreetype
        run: crystal run --release --error-trace spec/woff_unhinted_diff.cr -- .cidfont/NotoSansCJKjp-Regular.otf
